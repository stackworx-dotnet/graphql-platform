# Shared schema for differential validation fuzzing (graphql-js vs HotChocolate).
# Adapted from the graphql-js validation test harness. Must load identically in
# graphql-js `buildSchema` and HotChocolate schema-first. Avoids @oneOf to keep
# both parsers happy; custom scalar + custom directives are declared explicitly.

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

directive @onField on FIELD
directive @onQuery on QUERY
directive @complex(arg: String) repeatable on FIELD | FRAGMENT_SPREAD

scalar GeoPoint

enum DogCommand {
  SIT
  HEEL
  DOWN
}

enum FurColor {
  BROWN
  BLACK
  TAN
  SPOTTED
  NO_FUR
  UNKNOWN
}

interface Mammal {
  mother: Mammal
  father: Mammal
}

interface Pet {
  name(surname: Boolean): String
}

interface Canine implements Mammal {
  name(surname: Boolean): String
  mother: Canine
  father: Canine
}

type Dog implements Pet & Mammal & Canine {
  name(surname: Boolean): String
  nickname: String
  barkVolume: Int
  barks: Boolean
  tag: Int
  doesKnowCommand(dogCommand: DogCommand): Boolean
  isHouseTrained(atOtherHomes: Boolean = true): Boolean
  isAtLocation(x: Int, y: Int): Boolean
  distanceFrom(loc: GeoPoint): Float
  mother: Dog
  father: Dog
}

type Cat implements Pet {
  name(surname: Boolean): String
  nickname: String
  meows: Boolean
  meowsVolume: Int
  tag: String
  furColor: FurColor
}

union CatOrDog = Cat | Dog

union DogOrHuman = Dog | Human

type Human {
  name(surname: Boolean): String
  pets: [Pet]
  relatives: [Human]!
}

input ComplexInput {
  requiredField: Boolean!
  nonNullField: Boolean! = false
  intField: Int
  stringField: String
  booleanField: Boolean
  stringListField: [String]
}

input NestedInput {
  required: Int!
  child: ComplexInput
  children: [ComplexInput!]
  ints: [Int!]
}

type ComplicatedArgs {
  intArgField(intArg: Int): String
  nonNullIntArgField(nonNullIntArg: Int!): String
  stringArgField(stringArg: String): String
  booleanArgField(booleanArg: Boolean): String
  enumArgField(enumArg: FurColor): String
  floatArgField(floatArg: Float): String
  idArgField(idArg: ID): String
  stringListArgField(stringListArg: [String]): String
  stringListNonNullArgField(stringListNonNullArg: [String!]): String
  complexArgField(complexArg: ComplexInput): String
  nestedArgField(nested: NestedInput): String
  multipleReqs(req1: Int!, req2: Int!): String
  nonNullFieldWithDefault(arg: Int! = 0): String
  multipleOpts(opt1: Int = 0, opt2: Int = 0): String
  multipleOptAndReq(req1: Int!, req2: Int!, opt1: Int = 0, opt2: Int = 0): String
}

type Query {
  human(id: ID): Human
  dog: Dog
  cat: Cat
  pet: Pet
  catOrDog: CatOrDog
  dogOrHuman: DogOrHuman
  complicatedArgs: ComplicatedArgs
}

type Mutation {
  createDog(name: String!): Dog
}

type Subscription {
  newMessage: String
  newDog: Dog
  newHuman: Human
}
