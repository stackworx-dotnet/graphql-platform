name: 🍓 Fork CI

# Scoped CI for fork pull requests. Builds and tests ONLY the StrawberryShake projects the
# fork touches (codegen + runtime), with no Docker login and no database/message-broker
# service-container matrix. The full upstream `ci.yml` matrix is intentionally removed on this
# base branch because it is not sized for the fork's runner capacity (the DB/broker suites
# flake under contention) and it requires registry/cloud secrets the fork does not carry.
#
# PRs target this branch so they get a fast, deterministic green check instead of the flaky
# ~140-job matrix.

on:
  pull_request:
  push:
    branches:
      - fork-ci-base
      - fork
      - "release/fork-*"

permissions:
  contents: read

jobs:
  test:
    name: Build & test forked StrawberryShake projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
            11.0.100-preview.5.26302.115

      - name: Test StrawberryShake.Core
        run: dotnet test src/StrawberryShake/Client/test/Core.Tests/StrawberryShake.Core.Tests.csproj -c Release

      - name: Test StrawberryShake.Transport.Http
        run: dotnet test src/StrawberryShake/Client/test/Transport.Http.Tests/StrawberryShake.Transport.Http.Tests.csproj -c Release

      - name: Test StrawberryShake.Transport.InMemory
        run: dotnet test src/StrawberryShake/Client/test/Transport.InMemory.Tests/StrawberryShake.Transport.InMemory.Tests.csproj -c Release

      # The codegen snapshot tests bake the generator assembly version (0.0.0.0 in a minimal
      # build vs the version the committed snapshots expect), so they are not portable to this
      # lightweight CI. Compile the codegen + its test project here to catch build breaks in the
      # fix PRs; the snapshot tests run locally and in the full upstream matrix.
      - name: Build StrawberryShake.CodeGeneration (compile check)
        run: dotnet build src/StrawberryShake/CodeGeneration/test/CodeGeneration.CSharp.Tests/StrawberryShake.CodeGeneration.CSharp.Tests.csproj -c Release

      - name: Test StrawberryShake.Razor (only if the PR includes it)
        run: |
          p=src/StrawberryShake/Client/test/Razor.Tests/StrawberryShake.Razor.Tests.csproj
          if [ -f "$p" ]; then
            dotnet test "$p" -c Release
          else
            echo "Razor.Tests not present on this branch; skipping."
          fi
